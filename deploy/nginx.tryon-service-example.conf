# Nginx config for the Tryon microservice itself (Tryon-main / FastAPI +
# Uvicorn on port 8000) — ONLY relevant if TRYON_SERVICE_URL in the Node
# backend's .env points at a domain/address that's proxied through Nginx
# (e.g. https://tryon.zevrae.com). If TRYON_SERVICE_URL is instead a direct
# internal address (e.g. http://tryon-service:8000 on a shared Docker
# network), this file doesn't apply — that traffic never touches Nginx at
# all, and the relevant timeouts are GEMINI_TIMEOUT_SECONDS (Tryon-main's
# own .env) and TRYON_SERVICE_TIMEOUT_MS (Backend-main's .env) instead.
#
# Why this matters: if this Nginx's `proxy_read_timeout` is shorter than
# GEMINI_TIMEOUT_SECONDS (50s by default), Nginx will kill the connection
# to FastAPI and return ITS OWN error before the Python service's own clean
# timeout handling ever gets a chance to run — which is indistinguishable,
# from the Node backend's side, from Gemini just being slow. That's exactly
# the failure mode a raw ETIMEDOUT with no response body at all looks like.

upstream tryon_service {
    server 127.0.0.1:8000;  # the FastAPI/Uvicorn container itself
    keepalive 16;
}

server {
    listen 443 ssl http2;
    server_name tryon.zevrae.com;  # replace with whatever TRYON_SERVICE_URL actually resolves to

    ssl_certificate     /etc/letsencrypt/live/tryon.zevrae.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/tryon.zevrae.com/privkey.pem;

    # Same reasoning as the Node-facing config: a person photo + up to 5
    # garment photos (5MB each) is a large multipart body. Nginx's 1MB
    # default silently truncates it, which is a very plausible source of
    # the 422s seen earlier, separate from the timeout issue.
    client_max_body_size 40m;

    location /api/v1/tryon {
        proxy_pass http://tryon_service;

        # Must exceed GEMINI_TIMEOUT_SECONDS (50s default, in Tryon-main's
        # .env) with real margin — otherwise THIS proxy gives up before
        # FastAPI's own timeout handling does, and you lose the clean
        # error message that code now produces.
        proxy_read_timeout 75s;
        proxy_send_timeout 75s;
        proxy_connect_timeout 10s;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_http_version 1.1;
        proxy_request_buffering off;
    }

    location / {
        proxy_pass http://tryon_service;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
